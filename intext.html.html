<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiji Campus Bus & Weather Dashboard</title>

    <style>
        /* -----------------------------
           Page Styling
           ----------------------------- */
        body {
            font-family: Arial, sans-serif;
            background: #eaf6ff;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #005f99;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #aaa;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #0077cc;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #005fa3;
        }

        .result, .weather {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
        }

        .result {
            background: #f4f4f4;
        }

        .weather {
            background: #d9f7d9;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Fiji Campus Bus & Weather Dashboard</h1>

    <!-- Input field where students enter their fare budget -->
    <label for="budget">Enter Bus Fare Budget (FJD):</label>
    <input type="number" id="budget" placeholder="Example: 15">

    <!-- Button to calculate number of rides -->
    <button onclick="calculateRides()">Calculate Bus Rides</button>

    <!-- Area where the calculation result is displayed -->
    <div class="result" id="result">
        Number of rides will appear here.
    </div>

    <!-- Weather forecast box -->
    <div class="weather">
        <h3>Today's Weather in Suva</h3>
        <p>🌤️ Partly cloudy</p>
        <p>🌡️ Temperature: 28°C</p>
        <p>🌧️ Chance of Rain: 30%</p>
        <p>💨 Wind: Light breeze</p>
    </div>
</div>

<script>
    /*
      Function:
      Calculates how many bus rides a student can afford.

      Assumption:
      Each bus ride costs FJD $1.50.
    */
    function calculateRides() {

        // Read the budget entered by the user
        let budget = parseFloat(document.getElementById("budget").value);

        // Get the result display area
        let result = document.getElementById("result");

        // Check if the input is empty, invalid, zero, or negative
        if (isNaN(budget) || budget <= 0) {
            result.innerHTML = "Please enter a valid positive dollar amount.";
            result.style.color = "red";
            return;
        }

        // Cost per ride
        const fare = 1.50;

        // Calculate the maximum whole number of rides
        let rides = Math.floor(budget / fare);

        // Display the result in black
        result.style.color = "black";
        result.innerHTML =
            "With FJD $" + budget.toFixed(2) +
            ", you can afford <strong>" + rides +
            "</strong> bus ride(s).";
    }
</script>

</body>
</html>
